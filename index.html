<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekend in Piemonte</title>
<meta name="description" content="Our wine weekend in the Langhe, 27–29 Nov 2026. Anyone with the link can add and edit.">
<meta name="theme-color" content="#f5f0e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Piemonte">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{
  --paper:#f5f0e8; --card:#fffdf9; --ink:#211a17; --muted:#8c8178; --line:#ece4d8; --line2:#d9cfc1;
  --wine:#7a1c2e; --terra:#a5582a; --slate:#6f7782; --sage:#5f7350; --ring:#c0392b;
  --serif:'Libre Caslon Text',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.4 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--wine)}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1100px;margin:0 auto}
.top{flex:none;padding:calc(14px + var(--sat)) 16px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--wine);font-weight:500}
h1{font:400 26px/1.1 var(--serif);margin:3px 0 0;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:10px}
.avatars{display:flex}
.av{width:26px;height:26px;border-radius:50%;color:#fffdf9;font-size:11px;font-weight:600;display:grid;place-items:center;border:2px solid var(--paper);margin-left:-8px;flex:none}
.avatars .av:first-child{margin-left:0}
.plus{width:34px;height:34px;border-radius:50%;border:0;background:var(--wine);color:#fffdf9;display:grid;place-items:center;font-size:19px;flex:none}
.plus:active,.chip:active,.act:active,.btn:active,.heart:active,.pc:active{transform:scale(.96)}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 14px 28px}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--line2);background:rgba(251,248,243,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:7px 0 calc(7px + var(--sab));z-index:900}
.tabbar button{border:0;background:none;color:var(--muted);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 0}
.tabbar i{font-size:24px}
.tabbar button.on{color:var(--wine)}
@media (min-width:900px){
  .tabbar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:400px;border:.5px solid var(--line2);border-radius:22px;padding:8px 0;box-shadow:0 10px 34px rgba(33,26,23,.14)}
  main{margin-bottom:96px}
}

/* agenda */
.cal{height:100%;display:flex;flex-direction:column}
.cal-head{flex:none;display:grid;grid-template-columns:40px repeat(3,1fr);border-bottom:.5px solid var(--line2);padding:0 6px 7px}
.dh{text-align:center;font-size:11px;color:var(--muted);letter-spacing:.08em}
.dh b{display:grid;place-items:center;width:28px;height:28px;margin:2px auto 0;border-radius:50%;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:0}
.dh.today b{background:var(--wine);color:#fffdf9}
.dh .full{display:none}
@media (min-width:700px){ .dh .short{display:none} .dh .full{display:inline;font:italic 15px var(--serif);letter-spacing:0;color:var(--ink)} .dh b{display:inline-grid;margin:0 0 0 6px;vertical-align:middle} }
.cal-body{flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:40px repeat(3,1fr);padding:0 6px 24px;-webkit-overflow-scrolling:touch}
.hrs div{font-size:10.5px;color:var(--muted);text-align:right;padding-right:7px;transform:translateY(-6px);font-variant-numeric:tabular-nums}
.hrs div:first-child{visibility:hidden}
.col{position:relative;border-left:.5px solid var(--line)}
.ev{position:absolute;display:flex;flex-direction:column;justify-content:flex-start;border:0;border-left:3px solid;border-radius:5px;padding:4px 6px;text-align:left;font-size:11.5px;line-height:1.25;overflow:hidden;cursor:pointer}
.ev b{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ev span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.visit{background:#f1dde1;border-color:var(--wine);color:#5a1322}
.ev.meal{background:#f4e3d6;border-color:var(--terra);color:#6b3415}
.ev.drive{background:#e7e9ec;border-color:var(--slate);color:#3d434b}
.ev.other{background:#e4eadf;border-color:var(--sage);color:#33432a}
.now{position:absolute;left:-4px;right:0;height:2px;background:var(--ring);z-index:5;pointer-events:none}
.now:before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--ring)}

/* map */
#map{position:absolute;inset:0;background:#efe9df;z-index:1}
.leaflet-tile-pane{filter:grayscale(.6) sepia(.28) brightness(1.04) contrast(.92)}
.leaflet-control-attribution{font-size:9px;background:rgba(255,253,249,.7)!important}
.chips{position:absolute;top:calc(12px + var(--sat));left:12px;right:12px;z-index:500;display:flex;gap:6px;align-items:center}
.chip{border:0;background:var(--card);box-shadow:0 0 0 .5px var(--line2),0 2px 8px rgba(33,26,23,.08);border-radius:999px;padding:8px 13px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fffdf9}
.chips .plus{margin-left:auto;box-shadow:0 2px 8px rgba(33,26,23,.15)}
.strip{position:absolute;left:0;right:0;bottom:14px;z-index:500;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 14px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.pc{flex:0 0 min(240px,72vw);scroll-snap-align:center;background:var(--card);border-radius:16px;padding:11px 13px;box-shadow:0 0 0 .5px var(--line2),0 6px 20px rgba(33,26,23,.10);text-align:left;border:0}
.pc.active{box-shadow:0 0 0 1.5px var(--wine),0 6px 20px rgba(33,26,23,.12)}
.ey{font-size:10.5px;letter-spacing:.12em;color:var(--wine);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc h3{font:400 18px/1.2 var(--serif);margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .m{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.pin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fffdf9;border:2px solid #fffdf9;box-shadow:0 2px 6px rgba(0,0,0,.25);font-size:14px;transition:transform .15s}
.pin.winery{background:var(--wine)} .pin.restaurant{background:var(--terra)} .pin.stay,.pin.other{background:var(--sage)}
.pin.planned{box-shadow:0 0 0 2.5px var(--ring),0 2px 6px rgba(0,0,0,.25)}
.pin.sel{transform:scale(1.3)}
.clu{min-width:28px;height:28px;border-radius:14px;background:var(--ink);color:#fffdf9;border:2px solid #fffdf9;display:grid;place-items:center;font-size:12px;font-weight:600;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.placing #map{outline:3px dashed var(--wine);outline-offset:-3px}

/* lists */
.sec{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:18px 4px 8px;font-weight:500}
.group{background:var(--card);border-radius:14px;box-shadow:0 0 0 .5px var(--line2);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:.5px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:#faf6f0}
.row .b{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.red{color:var(--wine);text-decoration:none}
.heart{border:0;box-shadow:0 0 0 .5px var(--line2);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12.5px;display:flex;gap:4px;align-items:center;flex:none}
.heart.on{background:var(--wine);color:#fffdf9;box-shadow:none}
.heart i{font-size:14px}
.empty{color:var(--muted);text-align:center;padding:36px 16px;font-size:14px}
.tip{margin-top:22px;background:var(--card);border-radius:14px;box-shadow:0 0 0 .5px var(--line2);padding:14px;font-size:13.5px;color:var(--muted);display:flex;gap:10px}
.tip i{font-size:20px;color:var(--wine)}
.tip b{color:var(--ink);font-weight:600}
.you{font-size:11px;font-weight:500;background:var(--paper);color:var(--muted);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:2000;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(33,26,23,.38);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90vh;max-height:90dvh;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;padding:8px 18px calc(22px + var(--sab));transform:translateY(105%);transition:transform .34s cubic-bezier(.2,.85,.25,1);box-shadow:0 -10px 40px rgba(33,26,23,.15);-webkit-overflow-scrolling:touch}
.sheet-wrap.open{pointer-events:auto}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
@media (min-width:700px){
  .sheet{left:50%;right:auto;width:460px;margin-left:-230px;bottom:auto;top:50%;border-radius:20px;transform:translateY(-46%);opacity:0;transition:transform .25s,opacity .2s;padding-bottom:22px}
  .sheet-wrap.open .sheet{transform:translateY(-50%);opacity:1}
  .grab{visibility:hidden}
}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
.sh-ey{font-size:11px;letter-spacing:.12em;color:var(--wine);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.link{border:0;background:none;color:var(--wine);font-size:15px;letter-spacing:0;font-weight:500;padding:0}
.sh-t{font:400 25px/1.15 var(--serif);margin:6px 0 3px}
.sh-tr{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sh-m{font-size:13.5px;color:var(--muted)}
.acts{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:16px 0 4px}
.act{background:var(--paper);border-radius:13px;padding:10px 0 8px;text-align:center;font-size:11.5px;color:var(--wine);text-decoration:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.act i{font-size:21px}
.act.on{background:var(--wine);color:#fffdf9}
.kv{border-top:.5px solid var(--line);padding:12px 0 0;margin-top:12px;font-size:14px;white-space:pre-wrap}
.kv span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.status{border-radius:11px;padding:9px 11px;font-size:13px;margin-top:14px;display:flex;align-items:center;gap:7px;background:#f1dde1;color:#5a1322}
.status i{font-size:16px}
.btn{border:0;border-radius:13px;padding:13px 16px;font-weight:600;font-size:15px;background:var(--wine);color:#fffdf9;width:100%;display:flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--paper);color:var(--ink)}
.btn.danger{background:none;color:#b3261e;font-weight:500}
.btn:disabled{opacity:.6}
.f label{display:block;font-size:12px;color:var(--muted);margin:14px 2px 6px}
.f input,.f select,.f textarea{width:100%;border:0;background:var(--paper);border-radius:11px;padding:11px 12px;font-size:16px;color:var(--ink);-webkit-appearance:none;appearance:none;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{box-shadow:0 0 0 1.5px var(--wine)}
.f textarea{min-height:72px;resize:vertical}
.f .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper);border-radius:11px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 0;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 0 0 .5px var(--line2),0 1px 3px rgba(33,26,23,.08)}
.f-acts{display:flex;gap:8px;margin-top:20px}
.err{color:#b3261e;font-size:13px;margin-top:10px;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--sab));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fffdf9;padding:10px 16px;border-radius:999px;font-size:14px;z-index:3000;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}
.loading{color:var(--muted);text-align:center;padding:40px}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top">
    <div><div class="eyebrow">LANGHE · 27–29 NOV 2026</div><h1 id="title">Agenda</h1></div>
    <div class="top-r"><div class="avatars" id="avatars"></div><button class="plus" id="plus" aria-label="Add"><i class="ti ti-plus"></i></button></div>
  </header>
  <main>
    <section class="screen on" id="s-agenda"><div class="cal" id="cal"><div class="loading">Loading…</div></div></section>
    <section class="screen" id="s-map"><div id="map"></div><div class="chips" id="chips"></div><div class="strip" id="strip"></div></section>
    <section class="screen scroll" id="s-ideas"><div id="ideas"></div></section>
    <section class="screen scroll" id="s-crew"><div id="crew"></div></section>
  </main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="agenda" class="on"><i class="ti ti-calendar"></i>Agenda</button>
    <button data-tab="map"><i class="ti ti-map-2"></i>Map</button>
    <button data-tab="ideas"><i class="ti ti-bottle"></i>Ideas</button>
    <button data-tab="crew"><i class="ti ti-users"></i>Crew</button>
  </nav>
</div>
<div class="sheet-wrap" id="sheetWrap"><div class="scrim" id="scrim"></div><div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient("https://wcdmadzjwatbasvpjfln.supabase.co", "sb_publishable_Sdftd9mp2t48WSgLf11r_g_ieQklybp");
const T = { places:"piemont_we_places", events:"piemont_we_events", votes:"piemont_we_votes", people:"piemont_we_people" };
const DAYS = [
  { d:"2026-11-27", it:"Venerdì",  short:"VEN", n:27 },
  { d:"2026-11-28", it:"Sabato",   short:"SAB", n:28 },
  { d:"2026-11-29", it:"Domenica", short:"DOM", n:29 },
];
const H0 = 7, H1 = 23;
const EV = { visit:"Tasting", meal:"Meal", drive:"Drive", other:"Other" };
const PK = { winery:{ l:"Winery", i:"ti-glass-full", s:"WINERIES" }, restaurant:{ l:"Restaurant", i:"ti-tools-kitchen-2", s:"RESTAURANTS" }, stay:{ l:"Stay", i:"ti-bed", s:"STAY" }, other:{ l:"Other", i:"ti-map-pin", s:"OTHER" } };
const AV = ["#7a1c2e","#a5582a","#6f7782","#5f7350","#8a5a7a","#3f5f6f"];

let S = { places:[], events:[], votes:[], people:[] };
let me = null; try { me = localStorage.getItem("pwe_name"); } catch(e) {}
let tab = "agenda", mapFilter = "all", sheetState = null, scrolledCal = false;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const hhmm = t => t.slice(0,5);
const fmtMin = m => `${String(Math.floor(m/60)).padStart(2,"0")}:${String(m%60).padStart(2,"0")}`;
const dur = (a,b) => { const m = toMin(b)-toMin(a); return m%60 ? `${Math.floor(m/60)} h ${m%60}` : `${m/60} h`; };
const day = d => DAYS.find(x => x.d === d) || { it:d, short:d, n:"" };
const placeById = id => S.places.find(p => p.id === id);
const votesFor = id => S.votes.filter(v => v.place_id === id);
const mine = id => me && votesFor(id).find(v => v.voter.toLowerCase() === me.toLowerCase());
const town = p => p && p.address ? p.address.split(",").pop().trim() : "";
const plannedFor = id => S.events.filter(e => e.place_id === id).sort((a,b) => (a.day+a.start_time).localeCompare(b.day+b.start_time));
const gmaps = p => p.maps_url && /^https?:\/\//.test(p.maps_url) ? p.maps_url
  : (p.lat!=null ? `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}` : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name+" "+(p.address||"")+" Piemonte")}`);
const site = p => p.website && /^https?:\/\//.test(p.website) ? p.website : null;
const link = p => site(p) ? { url:site(p), label:"Website" } : { url:gmaps(p), label:"Google Maps" };
const dirUrl = p => p.lat!=null ? `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}` : gmaps(p);
const avColor = n => { let h=0; for (const c of n.toLowerCase()) h = (h*31 + c.charCodeAt(0)) >>> 0; return AV[h % AV.length]; };
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

// ---------- data ----------
async function load(){
  const [p,e,v,c] = await Promise.all([
    sb.from(T.places).select("*").order("name"),
    sb.from(T.events).select("*").order("day").order("start_time"),
    sb.from(T.votes).select("*"),
    sb.from(T.people).select("*").order("created_at"),
  ]);
  const err = p.error||e.error||v.error||c.error;
  if (err) { $("#cal").innerHTML = `<div class="loading">Couldn't load: ${esc(err.message)}</div>`; return; }
  S = { places:p.data, events:e.data, votes:v.data, people:c.data };
  renderAll();
}
let reloadT; const reload = () => { clearTimeout(reloadT); reloadT = setTimeout(load, 150); };
sb.channel("pwe").on("postgres_changes", { event:"*", schema:"public" }, x => { if (Object.values(T).includes(x.table)) reload(); }).subscribe();
document.addEventListener("visibilitychange", () => { if (!document.hidden) reload(); });

async function registerMe(oldName){
  if (!me) return;
  const has = n => S.people.find(p => p.name.toLowerCase() === (n||"").toLowerCase());
  if (has(me)) return;
  const prev = oldName && oldName.toLowerCase() !== me.toLowerCase() ? has(oldName) : null;
  const { error } = prev ? await sb.from(T.people).update({ name:me }).eq("id", prev.id) : await sb.from(T.people).insert({ name:me });
  if (!error) load();
}
function setMe(n){ me = n.trim().slice(0,40); try { localStorage.setItem("pwe_name", me); } catch(e) {} }

function renderAll(){
  renderTop(); renderCal(); renderIdeas(); renderCrew();
  if (map) { renderMarkers(); renderStrip(); if (!initMap.fitted && tab === "map" && visible().length) { fitMap(); initMap.fitted = true; } }
  if (sheetState && !sheetState.form) refreshSheet();
}

// ---------- shell ----------
const TITLES = { agenda:"Agenda", map:"Map", ideas:"Ideas", crew:"Crew" };
document.querySelectorAll("#tabbar button").forEach(b => b.onclick = () => showTab(b.dataset.tab));
function showTab(t){
  tab = t;
  document.querySelectorAll("#tabbar button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === "s-"+t));
  $("#top").style.display = t === "map" ? "none" : "";
  $("#title").textContent = TITLES[t];
  $("#plus").style.visibility = t === "crew" ? "hidden" : "visible";

// ---------- agenda ----------
function lanes(evs){
  const out = []; let group = [], end = -1;
  const flush = () => { const ln = []; group.forEach(e => { let i = ln.findIndex(x => x <= toMin(e.start_time)); if (i < 0) { i = ln.length; ln.push(0); } ln[i] = toMin(e.end_time); e._l = i; }); group.forEach(e => e._n = ln.length); out.push(...group); group = []; end = -1; };
  evs.forEach(e => { if (group.length && toMin(e.start_time) >= end) flush(); group.push(e); end = Math.max(end, toMin(e.end_time)); });
  if (group.length) flush();
  return out;
}
function renderCal(){
  const today = todayStr(), hours = H1 - H0;
  const head = `<div class="cal-head"><span></span>${DAYS.map(x => `<div class="dh ${x.d===today?"today":""}"><span class="short">${x.short}</span><span class="full">${x.it}</span><b>${x.n}</b></div>`).join("")}</div>`;
  let hrs = ""; for (let h = H0; h < H1; h++) hrs += `<div style="height:var(--hour)">${h}:00</div>`;
  const cols = DAYS.map(x => {
    const evs = lanes(S.events.filter(e => e.day === x.d).map(e => ({...e})));
    const blocks = evs.map(e => {
      const s = Math.max(toMin(e.start_time), H0*60), en = Math.min(toMin(e.end_time), H1*60), len = en - s;
      const p = e.place_id ? placeById(e.place_id) : null;
      const w = 100 / e._n;
      const sub = len >= 75 ? `<span>${hhmm(e.start_time)}${p && town(p) ? " · "+esc(town(p)) : ""}</span>` : "";
      return `<button class="ev ${e.kind}" data-id="${e.id}" style="top:calc(${(s-H0*60)/60} * var(--hour) + 1px);height:calc(${len/60} * var(--hour) - 3px);left:calc(${e._l*w}% + 2px);width:calc(${w}% - 5px)"><b>${esc(e.title)}</b>${sub}</button>`;
    }).join("");
    let now = "";
    if (x.d === today) { const d = new Date(), m = d.getHours()*60 + d.getMinutes(); if (m >= H0*60 && m <= H1*60) now = `<div class="now" style="top:calc(${(m-H0*60)/60} * var(--hour))"></div>`; }
    return `<div class="col" data-d="${x.d}" style="height:calc(${hours} * var(--hour));background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hour) - .5px),var(--line) calc(var(--hour) - .5px),var(--line) var(--hour))">${blocks}${now}</div>`;
  }).join("");
  const keep = $("#calBody") ? $("#calBody").scrollTop : null;
  $("#cal").innerHTML = head + `<div class="cal-body" id="calBody" style="--hour:48px"><div class="hrs">${hrs}</div>${cols}</div>`;
  if (keep != null) $("#calBody").scrollTop = keep; else scrollCal();
  $("#cal").querySelectorAll(".col").forEach(c => c.onclick = e => {
    if (e.target.closest(".ev")) return;
    if (!me) return askName();
    const hp = c.offsetHeight / hours, y = e.clientY - c.getBoundingClientRect().top;
    const start = Math.min(H0*60 + Math.floor(y / hp * 2) * 30, (H1-1)*60);
    openEventForm(null, { day:c.dataset.d, start_time:fmtMin(start), end_time:fmtMin(Math.min(start+120, H1*60-1)) });
  });
  $("#cal").querySelectorAll(".ev").forEach(b => b.onclick = () => openEvent(S.events.find(e => e.id === b.dataset.id)));
}
function scrollCal(){
  const b = $("#calBody"); if (!b || scrolledCal || !b.offsetHeight) return;
  const d = new Date(), today = DAYS.some(x => x.d === todayStr());
  const h = today ? Math.max(H0, d.getHours() - 1) : 8.5;
  b.scrollTop = (h - H0) * 48; scrolledCal = true;
}

function wireSeg(f){ f.querySelectorAll(".seg").forEach(s => s.querySelectorAll("button").forEach(b => b.onclick = () => { s.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); f[s.dataset.name].value = b.dataset.v; f[s.dataset.name].dispatchEvent(new Event("change")); })); }

function normUrl(u){ u = (u||"").trim(); if (!u) return null; return /^https?:\/\//i.test(u) ? u : "https://"+u; }
function coordsFromUrl(u){ if (!u) return null; const m = u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/) || u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/) || u.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/); return m ? { lat:+m[1], lng:+m[2] } : null; }
async function geocode(name, addr){
  for (const q of [`${name}, ${addr||""}, Piemonte, Italy`, `${addr||name}, Piemonte, Italy`]) {
    try { const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=it&viewbox=7.5,44.95,8.4,44.4&q=${encodeURIComponent(q)}`); const j = await r.json(); if (j[0]) return { lat:+j[0].lat, lng:+j[0].lon }; } catch(e) {}
  }
  return null;
}
function openPlaceForm(p){
  if (!me) return askName();
  openSheet(`<form class="f" id="fPl">
    <div class="sh-ey"><span>${p ? "EDIT PLACE" : "SUGGEST A PLACE"}</span><button type="button" class="link" id="plCancel">Cancel</button></div>

    <label>Address or town</label><input name="address" maxlength="200" placeholder="Castiglione Falletto" value="${esc(p?.address||"")}">
    <div class="r2"><div><label>Website</label><input name="website" maxlength="300" placeholder="vietti.com" value="${esc(p?.website||"")}"></div><div><label>Phone</label><input name="phone" type="tel" maxlength="40" placeholder="+39 0173 …" value="${esc(p?.phone||"")}"></div></div>
    <label>Google Maps link (optional)</label><input name="maps_url" maxlength="500" placeholder="Paste a link from Google Maps" value="${esc(p?.maps_url||"")}">
    <label>Why?</label><textarea name="note" maxlength="500" placeholder="Great Barolo, open on Sundays">${esc(p?.note||"")}</textarea>
    <div class="err" id="plErr"></div>
    <div class="f-acts">${p ? `<button type="button" class="btn danger" id="plDel" style="width:auto">Delete</button>` : ""}<button class="btn" type="submit" id="plSave">${p ? "Save" : "Add"}</button></div>

// ---------- map ----------
let map, cluster, markers = {}, activeId = null;
function initMap(){
  if (map) return;
  map = L.map("map", { zoomControl:false, attributionControl:true }).setView([44.63, 7.95], 12);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19,
    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
  cluster = L.markerClusterGroup({ showCoverageOnHover:false, maxClusterRadius:34, spiderfyOnMaxZoom:true,
    iconCreateFunction: c => L.divIcon({ className:"", html:`<div class="clu">${c.getChildCount()}</div>`, iconSize:[28,28] }) });
  map.addLayer(cluster);
  const strip = $("#strip"); let st;
  strip.addEventListener("scroll", () => { clearTimeout(st); st = setTimeout(() => {
    const r = strip.getBoundingClientRect(), mid = r.left + r.width/2;
    let best = null, bd = 1e9; strip.querySelectorAll(".pc").forEach(c => { const cr = c.getBoundingClientRect(), d = Math.abs(cr.left + cr.width/2 - mid); if (d < bd) { bd = d; best = c; } });
    if (best && best.dataset.id !== activeId) setActive(best.dataset.id, { pan:true });
  }, 140); }, { passive:true });
  renderMarkers(); renderStrip();
}
const visible = () => S.places.filter(p => p.lat != null && (mapFilter === "all" || p.kind === mapFilter || (mapFilter === "stay" && p.kind === "other")));
const pinIcon = (p, sel) => L.divIcon({ className:"", html:`<div class="pin ${p.kind} ${plannedFor(p.id).length?"planned":""} ${sel?"sel":""}"><i class="ti ${PK[p.kind].i}"></i></div>`, iconSize:[28,28], iconAnchor:[14,14] });
function renderMarkers(){
  const chips = [["all","All"],["winery","Wineries"],["restaurant","Restaurants"]];
  $("#chips").innerHTML = chips.map(([k,l]) => `<button class="chip ${k===mapFilter?"on":""}" data-k="${k}">${l}</button>`).join("") + `<button class="plus" id="mapPlus" aria-label="Suggest a place"><i class="ti ti-plus"></i></button>`;
  $("#chips").querySelectorAll(".chip").forEach(b => b.onclick = () => { mapFilter = b.dataset.k; renderMarkers(); renderStrip(); fitMap(); });
  $("#mapPlus").onclick = onPlus;
  cluster.clearLayers(); markers = {};
  visible().forEach(p => {
    const m = L.marker([p.lat, p.lng], { icon:pinIcon(p, p.id === activeId) });
    m.on("click", () => { setActive(p.id, { scroll:true }); openPlace(p); });
    markers[p.id] = m; cluster.addLayer(m);
  });
}
function renderStrip(){
  const list = visible().sort((a,b) => a.lng - b.lng);
  $("#strip").innerHTML = list.map(p => {
    const pl = plannedFor(p.id)[0], v = votesFor(p.id).length;
    return `<button class="pc ${p.id===activeId?"active":""}" data-id="${p.id}"><div class="ey">${PK[p.kind].l.toUpperCase()}${town(p) ? " · "+esc(town(p).toUpperCase()) : ""}</div><h3>${esc(p.name)}</h3>
      <div class="m"><span>${pl ? `<span class="red">${day(pl.day).it} ${hhmm(pl.start_time)}</span>` : "Not planned"}</span><span>♥ ${v}</span></div></button>`;
  }).join("");
  $("#strip").querySelectorAll(".pc").forEach(c => c.onclick = () => { setActive(c.dataset.id, { pan:true }); openPlace(placeById(c.dataset.id)); });
}
function setActive(id, { pan, scroll } = {}){
  const prev = activeId; activeId = id;
  [prev, id].forEach(x => { const p = placeById(x), m = markers[x]; if (p && m) m.setIcon(pinIcon(p, x === id)); });
  $("#strip").querySelectorAll(".pc").forEach(c => c.classList.toggle("active", c.dataset.id === id));
  const p = placeById(id);
  if (pan && p && markers[id]) cluster.zoomToShowLayer(markers[id], () => map.panTo([p.lat, p.lng], { animate:true }));
  if (scroll) { const c = $(`#strip .pc[data-id="${id}"]`); if (c) c.scrollIntoView({ behavior:"smooth", inline:"center", block:"nearest" }); }
}
function fitMap(){
  const pts = visible(); if (!map || !pts.length) return;
  map.fitBounds(L.latLngBounds(pts.map(p => [p.lat, p.lng])), { paddingTopLeft:[30, 70], paddingBottomRight:[30, 120], maxZoom:14 });
}

// ---------- ideas ----------
function renderIdeas(){
  const groups = ["winery","restaurant","stay","other"].map(k => [k, S.places.filter(p => p.kind === k)]).filter(([,l]) => l.length);
  if (!groups.length) { $("#ideas").innerHTML = `<div class="empty">No places yet. Tap ＋ to suggest one.</div>`; return; }
  $("#ideas").innerHTML = groups.map(([k, list]) => `<div class="sec">${PK[k].s}</div><div class="group">${
    list.map(p => ({ p, v:votesFor(p.id) })).sort((a,b) => b.v.length - a.v.length || a.p.name.localeCompare(b.p.name)).map(({p, v}) => {
      const pl = plannedFor(p.id)[0], my = mine(p.id);
      const meta = [town(p) ? esc(town(p)) : "", pl ? `<span class="red">${day(pl.day).it.slice(0,3)} ${hhmm(pl.start_time)}</span>` : `<a class="red" href="${esc(link(p).url)}" target="_blank" rel="noopener" data-stop>${link(p).label}</a>`].filter(Boolean).join(" · ");
      return `<div class="row" data-id="${p.id}"><div class="b"><div class="t">${esc(p.name)}</div><div class="m">${meta}</div></div><button class="heart ${my?"on":""}" data-vote="${p.id}"><i class="ti ti-heart"></i>${v.length}</button></div>`;
    }).join("")}</div>`).join("");
  $("#ideas").querySelectorAll(".row").forEach(r => r.onclick = e => { if (e.target.closest("[data-stop],[data-vote]")) return; openPlace(placeById(r.dataset.id)); });
  $("#ideas").querySelectorAll("[data-vote]").forEach(b => b.onclick = () => toggleVote(b.dataset.vote));
}

// ---------- crew ----------
function renderCrew(){
  const meLc = (me||"").toLowerCase();
  const count = n => S.events.filter(e => (e.added_by||"").toLowerCase() === n.toLowerCase()).length + S.places.filter(p => (p.added_by||"").toLowerCase() === n.toLowerCase()).length;
  const votes = n => S.votes.filter(v => v.voter.toLowerCase() === n.toLowerCase()).length;
  $("#crew").innerHTML = `<div class="sec">${S.people.length} ${S.people.length === 1 ? "PERSON" : "PEOPLE"}</div>` + (S.people.length ? `<div class="group">${S.people.map(p => {
    const a = count(p.name), v = votes(p.name);
    const meta = [a ? `${a} added` : "", v ? `${v} ${v>1?"votes":"vote"}` : ""].filter(Boolean).join(" · ") || "Just joined";
    return `<div class="row" style="cursor:default"><span class="av" style="width:36px;height:36px;font-size:14px;margin:0;border:0;background:${avColor(p.name)}">${esc(p.name[0].toUpperCase())}</span><div class="b"><div class="t">${esc(p.name)}${p.name.toLowerCase()===meLc?'<span class="you">you</span>':""}</div><div class="m">${meta}</div></div></div>`;
  }).join("")}</div>` : `<div class="empty">People show up here once they open the page and enter their name.</div>`)
  + `<div class="tip"><i class="ti ti-device-mobile"></i><div><b>Put it on your home screen</b><br>iPhone: Share → Add to Home Screen. Android: menu → Add to Home screen. It then opens like an app.</div></div>`
  + `<div style="text-align:center;margin-top:16px"><button class="link" id="rename" style="font-size:13.5px">${me ? `Not ${esc(me)}? Change name` : "Enter your name"}</button></div>`;
  $("#rename").onclick = askName;
}

// ---------- boot ----------
const startTab = ["agenda","map","ideas","crew"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "agenda";
showTab(startTab);
if (!me) askName();
load().then(() => { scrollCal(); if (me) registerMe(); });
setInterval(() => { if (tab === "agenda" && !document.hidden) renderCal(); }, 60000);
</script>
</body>
</html>
